<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rock Paper Scissors</title>
    <script src="script.js" defer></script>
    <link rel="stylesheet" href="style.css">


    <!-- google fonts -->
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&icon_names=restart_alt,settings" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Jersey+10&family=Plus+Jakarta+Sans:ital,wght@0,200..800;1,200..800&family=Press+Start+2P&display=swap" rel="stylesheet">

    <style>
        .material-symbols-outlined {
        font-variation-settings:
        'FILL' 1,
        'wght' 400,
        'GRAD' 0,
        'opsz' 24
        }
    </style>

</head>
<body>
    <div class="navbar">
        <button class="leaderboard-button btn" title="Reset Game">
            <span class="material-symbols-outlined">
                restart_alt
            </span>
        </button>
        <div class="navtitle"><h1>Rock Paper Scissors</h1></div>
        <button class="settings-button btn" title="Settings"><span class="material-symbols-outlined">
            settings
        </span></button>
    </div>

    <div class="container">
        <div class="scores">
            <div class="scorecard human card">
                <div class="scorecard-text">You</div>
                <div class="human-score">10</div>
            </div>
            <div class="scorecard bot card">
                <div class="scorecard-text">Computer</div>
                <div class="bot-score">01</div>
            </div>
        </div>
        <div class="arena card">
            <div class="arena-text"><h1>Choose</h1></div>
            <div class="arena-content">

                <div class="player-card human-card">
                    <div class="player-symbol"><img src="assets/rock.svg" alt="" style="width: 100%;"></div>
                    <div class="player-name">You</div>
                </div>
                <div class="versus">vs</div>
                <div class="player-card bot-card">
                    <div class="player-symbol"><img src="assets/paper.svg" alt="" style="width: 100%; transform: scaleX(-1);"></div>
                    <div class="player-name">Computer</div>
                </div>
            </div>
            <div class="player-choices">
                <div class="choice">
                    <button class="rock-icon btn"><img src="assets/rock.svg" alt="Rock Image"></button>
                    <div class="choice-text"><h3>Rock</h3></div>
                </div>
                <div class="choice">
                    <button class="paper-icon btn"><img src="assets/paper.svg" alt="Paper Image"></button>
                    <div class="choice-text"><h3>Paper</h3></div>
                </div>
                <div class="choice">
                    <button class="scissors-icon btn"><img src="assets/scissors.svg" alt="Paper Image"></button>
                    <div class="choice-text"><h3>Scissors</h3></div>
                </div>
            </div>
            <button class="status-card btn"><span class="verdict">You Win!</span><br> Click to Continue</button>

        </div>

    </div>
</body>
</html>
